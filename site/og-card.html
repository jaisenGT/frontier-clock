<!doctype html>
<!-- Source for og.png, the 1200x630 link-preview image. Regenerate after a data refresh (see README). -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="robots" content="noindex">
  <title>Frontier Clock card</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/plotly.js/2.35.0/plotly-basic.min.js"></script>
  <style>
    :root { --page: #f1efe9; --text: #0b0b0b; --muted: #52514e; --faint: #77756f; --grid: #e1e0d9; --axis: #c3c2b7;
      --accent: #6250d6; --china: #eb6834; --open: #1baf7a; }
    * { box-sizing: border-box; }
    html, body { margin: 0; }
    body { width: 1200px; height: 630px; overflow: hidden; background: var(--page); color: var(--text);
      font-family: Inter, system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
    .card { display: grid; grid-template-columns: 430px 1fr; gap: 28px; height: 100%; padding: 56px 56px 44px 64px;
      background: radial-gradient(700px 320px at 100% 0%, rgba(42, 120, 214, 0.10), transparent 70%); }
    .brand { display: flex; align-items: center; gap: 12px; font-size: 26px; font-weight: 700; letter-spacing: -0.02em; }
    .brand svg { width: 34px; height: 34px; }
    h1 { font-size: 44px; line-height: 1.08; letter-spacing: -0.035em; margin: 34px 0 34px; font-weight: 700; }
    .stat { border-left: 5px solid; padding: 2px 0 2px 20px; margin-bottom: 26px; }
    .stat .lead { font-size: 21px; color: var(--muted); }
    .stat .value { font-size: 58px; font-weight: 700; letter-spacing: -0.04em; line-height: 1.05; }
    .stat .ci { font-size: 17px; color: var(--faint); margin-top: 2px; }
    .right { display: flex; flex-direction: column; min-width: 0; }
    .chart-title { font-size: 20px; font-weight: 600; margin: 6px 0 2px 8px; }
    .chart-sub { font-size: 16px; color: var(--muted); margin: 0 0 4px 8px; }
    #chart { flex: 1; }
    .foot { font-size: 16px; color: var(--faint); margin: 2px 0 0 8px; }
  </style>
</head>
<body>
  <div class="card">
    <div>
      <div class="brand">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="12" cy="12" r="10" fill="none" stroke="currentColor" stroke-width="1.75"/>
          <path d="M12 6.5V12l3.75 2.5" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        Frontier Clock
      </div>
      <h1>How far behind the AI frontier?</h1>
      <div id="stats"></div>
    </div>
    <div class="right">
      <div class="chart-title">Months behind the frontier</div>
      <div class="chart-sub" id="sub"></div>
      <div id="chart"></div>
      <div class="foot">frontierclock.org · data: Epoch AI (CC BY 4.0)</div>
    </div>
  </div>
  <script type="module">
    import { analyze, groupLags, releaseGrid, toYear } from "./core.js";

    const GROUPS = [
      { key: "China", label: "China", lead: "China is behind by", color: "--china" },
      { key: "Open weights (non-China)", label: "Open weights (non-China)", lead: "Non-China open weights are behind by", color: "--open" },
    ];
    const css = (n) => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
    const iso = (t) => new Date(Math.round((t - 1970) * 365.25) * 864e5).toISOString().slice(0, 10);

    // Same settings as the site's hero numbers.
    const data = await (await fetch("data/frontier_clock.json")).json();
    data.models.forEach((m) => (m._t = toYear(m.date)));
    const res = analyze(data, data.benchmarks.map((_, i) => i), "interp", { minBenchmarks: 2 });
    const grid = releaseGrid(data);
    const lags = groupLags(res.rows, GROUPS.map((g) => g.key), grid);
    const iv = await (await fetch("data/intervals.json")).json();
    const run = iv.version === data.version ? iv.runs["all|interp|2"] : null;

    const stats = document.getElementById("stats");
    for (const g of GROUPS) {
      const p = lags[g.key].at(-1), ci = run?.lags[g.key]?.at(-1);
      const el = document.createElement("div");
      el.className = "stat";
      el.style.borderColor = css(g.color);
      el.innerHTML = `<div class="lead"></div><div class="value"></div><div class="ci"></div>`;
      el.querySelector(".lead").textContent = g.lead;
      el.querySelector(".value").textContent = `${p.lagMonths.toFixed(1)} months`;
      el.querySelector(".ci").textContent = ci ? `90% CI ${ci[1].toFixed(1)}–${ci[2].toFixed(1)} months` : "";
      stats.append(el);
    }
    const asOf = new Date((grid.at(-1) - 1970) * 365.25 * 864e5).toLocaleDateString("en-US", { month: "short", day: "numeric", year: "numeric", timeZone: "UTC" });
    document.getElementById("sub").textContent = `Best model from each group vs. best overall, to ${asOf}`;

    const traces = [], annotations = [];
    for (const g of GROUPS) {
      const s = lags[g.key];
      traces.push({ x: s.map((p) => iso(p.T)), y: s.map((p) => p.lagMonths), mode: "lines", line: { color: css(g.color), width: 4, shape: "hv" } });
      annotations.push({ x: iso(s.at(-1).T), y: s.at(-1).lagMonths, xanchor: "left", xshift: 8, showarrow: false,
        text: g.label === "China" ? "China" : "Open weights<br>(non-China)", align: "left", font: { size: 16, color: css("--muted") } });
    }
    const axis = { gridcolor: css("--grid"), linecolor: css("--axis"), zeroline: false, showline: true, tickfont: { size: 16, color: css("--faint") } };
    Plotly.newPlot("chart", traces, {
      paper_bgcolor: "rgba(0,0,0,0)", plot_bgcolor: "rgba(0,0,0,0)", showlegend: false, margin: { l: 64, r: 118, t: 14, b: 34 },
      font: { family: "Inter, system-ui, sans-serif" }, annotations,
      xaxis: { ...axis, type: "date", range: [iso(lags[GROUPS[1].key][0].T - 0.08), iso(grid.at(-1) + 0.04)], nticks: 5 },
      yaxis: { ...axis, rangemode: "tozero", ticksuffix: " mo", automargin: true },
    }, { staticPlot: true }).then(() => (document.body.dataset.ready = "1"));
  </script>
</body>
</html>
